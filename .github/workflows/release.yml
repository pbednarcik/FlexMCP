name: release
on:
  push:
    tags:
      # The root module's tags only: a nested module's tag, such as
      # otel/v0.1.0, does not match, so it cuts no second release.
      - 'v*'

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout: --verify-tag checks the tag on the remote, and GH_REPO
      # names the repository gh would otherwise read from a clone.
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            prerelease=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" "${prerelease[@]}"
