name: govulncheck
on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    # Weekly, so a vulnerability published for a dependency shows up without a push.
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: ['.', 'otel']
    # Plain steps rather than golang/govulncheck-action: its go-version-input
    # defaults to "stable" and wins over go-version-file, so the scan would use
    # the newest Go instead of the toolchain the module names.
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: ${{ matrix.module }}/go.mod
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
        working-directory: ${{ matrix.module }}
