name: go
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - run: go test ./... -race

  test-otel:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "otel/go.mod"
      - run: go test ./... -race
        working-directory: otel

  bench-compare:
    strategy:
      fail-fast: false
      matrix:
        module: [harness, flexmcp, mcpgo, gosdk, run]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "bench/compare/${{ matrix.module }}/go.mod"
      - run: go test ./... -race
        working-directory: bench/compare/${{ matrix.module }}
      - if: matrix.module != 'harness' && matrix.module != 'run'
        run: go test -run '^$' -bench . -benchtime=1x ./...
        working-directory: bench/compare/${{ matrix.module }}

  verify-codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: "go.mod"
      - name: Run code generation
        run: go generate ./...
      - name: Check for uncommitted changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "Error: Generated code is not up to date. Please run 'go generate ./...' and commit the changes."
            git status
            git diff
            exit 1
          fi
