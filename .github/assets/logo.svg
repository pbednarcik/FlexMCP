<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 100" width="420" height="100" role="img" aria-labelledby="title">
  <title id="title">FlexMCP</title>
  <style>
    .ink { stroke: #1f2328; }
    @media (prefers-color-scheme: dark) { .ink { stroke: #e6edf3; } }
  </style>
  <defs>
    <linearGradient id="flex" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
    <linearGradient id="flexText" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="160" y2="0">
      <stop offset="0" stop-color="#00ADD8"/>
      <stop offset="1" stop-color="#7C4DFF"/>
    </linearGradient>
  </defs>

  <!-- mark: two endpoints joined by a flexing link -->
  <rect x="2" y="10" width="80" height="80" rx="20" fill="url(#flex)"/>
  <g fill="none" stroke="#fff" stroke-width="7" stroke-linecap="round">
    <path d="M24 66 C 24 34, 60 66, 60 34"/>
  </g>
  <circle cx="24" cy="66" r="8" fill="#fff"/>
  <circle cx="60" cy="34" r="8" fill="#fff"/>

  <!-- wordmark: monoline strokes, cap height 60 before scaling -->
  <g transform="translate(106 5) scale(0.9)" fill="none" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="url(#flexText)">
      <path d="M0 80 V20 H32 M0 48 H26"/>
      <path d="M46 20 V68 Q46 80 57 80"/>
      <path d="M68 59 H110 A21 21 0 1 0 103.8 73.8"/>
      <path d="M124 38 L158 80 M158 38 L124 80"/>
    </g>
    <g class="ink">
      <path d="M176 80 V20 L201 56 L226 20 V80"/>
      <path d="M293.2 28.8 A30 30 0 1 0 293.2 71.2"/>
      <path d="M310 80 V20 H328 A15 15 0 0 1 328 50 H310"/>
    </g>
  </g>
</svg>
